# ===================================================================
# Configuración Spring Boot - CU 28 "Registrar recepción de bolsín"
# ===================================================================

# Nombre de la aplicación y puerto
spring.application.name=bolsines
server.port=8080

# -------------------------------------------------------------------
# Persistencia: Base de datos H2 en modo archivo
# Los datos se guardan en ./data/bolsines.mv.db para persistir reinicios
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/bolsines;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web H2 (/h2-console) para visualizar tablas y cambios en la defensa
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# -------------------------------------------------------------------
# Configuración JPA / Hibernate
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Deshabilitar Open-In-View para forzar que las transacciones y DTOs
# se resuelvan dentro del servicio (@Transactional) y evitar LazyInitializationException
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Control de demo: Si es true, reinicia y resiembra la base de datos
# -------------------------------------------------------------------
bolsines.reset-on-start=false

