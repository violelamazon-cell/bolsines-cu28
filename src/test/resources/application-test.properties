# ===================================================================
# Configuración Spring Boot para Tests de Integración
# Base de datos H2 volátil en memoria (aislada de ./data/bolsines)
# ===================================================================
spring.application.name=bolsines-test

spring.datasource.url=jdbc:h2:mem:bolsines-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

bolsines.reset-on-start=false

